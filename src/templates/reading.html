<article class="reader-shell reader-{{FORMAT}}" data-piece-id="{{PIECE_ID}}">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="{{ROOT_PREFIX}}index.html">Prototype index</a>
    <span aria-hidden="true">/</span>
    <span>{{SECTION_TITLE}}</span>
  </nav>

  <header class="piece-header">
    <p class="section-label">{{SECTION_LABEL}}</p>
    <h1>{{PIECE_TITLE}}</h1>
    <p class="source-reference">Source pages {{SOURCE_PAGES}}</p>
  </header>

  <div class="piece-body">
    {{BLOCKS}}
  </div>

  <footer class="piece-footer">
    <p>Canonical position {{GLOBAL_ORDER}} of 94</p>
    <a href="{{ROOT_PREFIX}}index.html">Return to exemplar index</a>
  </footer>
</article>
