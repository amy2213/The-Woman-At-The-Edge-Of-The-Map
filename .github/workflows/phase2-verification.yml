name: Phase 2 Verification

on:
  push:
    branches:
      - redesign/source-lock-v7
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out committed branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare verification evidence
        run: mkdir -p verification

      - name: Verify canonical content
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/content-validation.log

      - name: Build all 104 pages
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee verification/build.log

      - name: Verify internal links
        shell: bash
        run: |
          set -o pipefail
          npm run check:links 2>&1 | tee verification/link-check.log

      - name: Install browser verification tools
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save playwright@1.52.0 axe-core@4.10.3 2>&1 | tee verification/browser-install.log
          npx playwright install --with-deps chromium 2>&1 | tee -a verification/browser-install.log

      - name: Verify desktop, mobile, keyboard, and accessibility
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-browser.mjs 2>&1 | tee verification/browser-verification.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-verification-${{ github.sha }}
          path: |
            verification/
            docs-full-preview/build-report.json
            docs-full-preview/sitemap.txt
          if-no-files-found: warn
          retention-days: 30
