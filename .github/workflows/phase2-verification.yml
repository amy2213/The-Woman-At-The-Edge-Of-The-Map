name: Phase 2 Locked Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-locked-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-locked-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SITE_OUTPUT_DIR: docs
      SITE_BASE_URL: https://amy2213.github.io/The-Woman-At-The-Edge-Of-The-Map/

    steps:
      - name: Check out committed branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare verification evidence
        run: mkdir -p verification

      - name: Diagnose canonical hashes
        continue-on-error: true
        shell: bash
        run: node scripts/diagnose-content-hashes.mjs > verification/hash-diagnostics.log 2>&1

      - name: Verify locked canonical content
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/content-validation.log

      - name: Build current production artifact
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee verification/build.log

      - name: Install browser verification tools
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save playwright@1.52.0 axe-core@4.10.3 2>&1 | tee verification/browser-install.log
          npx playwright install --with-deps chromium 2>&1 | tee -a verification/browser-install.log

      - name: Render release assets
        shell: bash
        run: |
          set -o pipefail
          npm run render:assets 2>&1 | tee verification/release-assets.log

      - name: Verify internal links
        shell: bash
        run: |
          set -o pipefail
          npm run check:links 2>&1 | tee verification/link-check.log

      - name: Verify desktop, mobile, keyboard, metadata, and accessibility
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-browser.mjs 2>&1 | tee verification/browser-verification.log

      - name: Upload locked-phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-locked-verification-${{ github.sha }}
          path: |
            verification/
            docs/build-report.json
            docs/release-manifest.json
            docs/sitemap.xml
          if-no-files-found: warn
          retention-days: 30
