name: Phase 2 Verification

on:
  push:
    branches:
      - redesign/source-lock-v7
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out committed branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify canonical content
        run: npm test

      - name: Build all 104 pages
        run: npm run build

      - name: Verify internal links
        run: npm run check:links

      - name: Install browser verification tools
        run: |
          npm install --no-save playwright@1.52.0 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Verify desktop, mobile, keyboard, and accessibility
        run: node scripts/verify-browser.mjs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-verification-${{ github.sha }}
          path: |
            verification/
            docs-full-preview/build-report.json
            docs-full-preview/sitemap.txt
          if-no-files-found: warn
          retention-days: 30
