name: Deploy Verified Release to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: main
        type: string
      expected_commit:
        description: Exact 40-character commit SHA authorized for release
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to authorize the live-site replacement
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      site_base_url: ${{ steps.pages.outputs.base_url }}

    steps:
      - name: Check out authorized release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Enforce release authorization
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirmation }}" != "DEPLOY" ]]; then
            echo "Deployment confirmation must be exactly DEPLOY."
            exit 1
          fi
          resolved_sha="$(git rev-parse HEAD)"
          if [[ ! "${{ inputs.expected_commit }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected_commit must be a complete 40-character commit SHA."
            exit 1
          fi
          if [[ "${resolved_sha,,}" != "${{ inputs.expected_commit }}" ]]; then
            echo "Resolved release SHA ${resolved_sha} does not match the authorized SHA ${{ inputs.expected_commit }}."
            exit 1
          fi
          echo "sha=${resolved_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare release evidence
        run: mkdir -p verification

      - name: Validate canonical content
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/deployment-content-validation.log

      - name: Build authorized production release
        shell: bash
        env:
          SITE_OUTPUT_DIR: docs
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          set -o pipefail
          npm run build 2>&1 | tee verification/deployment-build.log

      - name: Install browser verification tools
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save playwright@1.52.0 axe-core@4.10.3 2>&1 | tee verification/deployment-browser-install.log
          npx playwright install --with-deps chromium 2>&1 | tee -a verification/deployment-browser-install.log

      - name: Render release images
        shell: bash
        env:
          SITE_OUTPUT_DIR: docs
        run: |
          set -o pipefail
          npm run render:assets 2>&1 | tee verification/deployment-release-assets.log

      - name: Verify release contract
        shell: bash
        env:
          SITE_OUTPUT_DIR: docs
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          set -o pipefail
          node scripts/verify-release.mjs 2>&1 | tee verification/deployment-release-contract.log

      - name: Verify internal links
        shell: bash
        env:
          SITE_OUTPUT_DIR: docs
        run: |
          set -o pipefail
          npm run check:links 2>&1 | tee verification/deployment-link-check.log

      - name: Verify desktop, mobile, keyboard, metadata, and accessibility
        shell: bash
        env:
          SITE_OUTPUT_DIR: docs
        run: |
          set -o pipefail
          node scripts/verify-browser.mjs 2>&1 | tee verification/deployment-browser-verification.log

      - name: Upload predeployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: predeployment-evidence-${{ steps.release.outputs.sha }}
          path: verification/
          if-no-files-found: error
          retention-days: 30

      - name: Package verified GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
          include-hidden-files: true
          retention-days: 1

  deploy-and-smoke-test:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out deployed release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-verify.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy verified artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke test live website
        shell: bash
        env:
          SITE_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -o pipefail
          mkdir -p verification
          for attempt in {1..12}; do
            echo "Live smoke-test attempt ${attempt} of 12"
            if npm run smoke:live 2>&1 | tee verification/live-smoke-test.log; then
              exit 0
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Live smoke test failed after 12 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Upload live deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-deployment-evidence-${{ needs.build-and-verify.outputs.release_sha }}
          path: |
            verification/live-smoke-test.log
            verification/live-smoke-test.json
          if-no-files-found: warn
          retention-days: 30
