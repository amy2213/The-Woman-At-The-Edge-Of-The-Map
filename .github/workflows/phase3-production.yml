name: Phase 3 Production Verification

on:
  push:
    branches:
      - redesign/phase-3-production
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SITE_OUTPUT_DIR: docs
      SITE_BASE_URL: https://amy2213.github.io/The-Woman-At-The-Edge-Of-The-Map/

    steps:
      - name: Check out committed branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare verification evidence
        run: mkdir -p verification

      - name: Validate canonical content
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/content-validation.log

      - name: Build production site
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee verification/production-build.log

      - name: Install browser verification tools
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save playwright@1.52.0 axe-core@4.10.3 2>&1 | tee verification/browser-install.log
          npx playwright install --with-deps chromium 2>&1 | tee -a verification/browser-install.log

      - name: Render release images
        shell: bash
        run: |
          set -o pipefail
          npm run render:assets 2>&1 | tee verification/release-assets.log

      - name: Verify production release contract
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-release.mjs 2>&1 | tee verification/release-contract.log

      - name: Verify internal links
        shell: bash
        run: |
          set -o pipefail
          npm run check:links 2>&1 | tee verification/link-check.log

      - name: Verify desktop, mobile, keyboard, metadata, and accessibility
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-browser.mjs 2>&1 | tee verification/browser-verification.log

      - name: Upload production artifact and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-production-${{ github.sha }}
          path: |
            docs/
            verification/
          if-no-files-found: error
          retention-days: 30
